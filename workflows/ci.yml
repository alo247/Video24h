name: CI / Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Type Check (TypeScript)
        run: npm run lint

      - name: Build Application (Vite Production Build)
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -d dist
          test -f dist/index.html
          echo "✓ Build artifacts verified successfully in dist/"
